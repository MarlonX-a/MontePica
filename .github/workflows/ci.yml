name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate Expo project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MontePica

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.x
          cache: npm
          cache-dependency-path: MontePica/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter when configured
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "No lint script configured; skipping."
          fi

      - name: Run unit tests when configured
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No test script configured; skipping."
          fi
